<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="sidebar">
    <div class="menu">
      <a href="/index.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 12L12 4l9 8v8a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>
      </a>

      <a href="cart.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </a>

      <a href="invoice.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </a>

      <a href="addproduct.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M4 8h16M4 12h16M4 16h16"/></svg>
      </a>

      <a href="notification.html" class="nav-item">
        <svg viewBox="0 0 24 24">
          <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7"/>
        </svg>
      </a>


      <div class="nav-item">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
        </svg>
      </div>

      <div class="nav-item">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div> <div class="bottom">
      <div class="nav-item">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19 12a7 7 0 00-14 0"/>
        </svg>
      </div>
    </div>
  </div>

    <main class="main-content">
      <header class="header">
        <h1>Add Product</h1>
      </header>

      <div class="content-card">
        <button class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>

        <div class="upload-section">
          <div class="upload-placeholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="#e5e7eb"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          </div>
          <p>Upload Image</p>
        </div>

        <form class="product-form">
          <div class="form-grid">
            <div class="form-group">
              <label>Product Name :</label>
              <input type="text" placeholder="Product Name">
            </div>
            <div class="form-group">
              <label>Product ID :</label>
              <input type="text" placeholder="123456789">
            </div>
            <div class="form-group">
              <label>Category :</label>
              <input type="text" placeholder="Enter Category">
            </div>
            <div class="form-group">
              <label>Price :</label>
              <input type="text" placeholder="Enter Price">
            </div>
            <div class="form-group">
              <label>Status :</label>
              <select>
                <option value="">Select Status</option>
                <option value="active">In Stock</option>
                <option value="inactive">Out of Stock</option>
              </select>
            </div>
            <div class="form-group">
              <label>Quantity :</label>
              <input type="text" placeholder="Enter Quantity">
            </div>
          </div>

          <div class="form-footer">
            <button type="submit" class="save-btn">Save Product</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
