<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice History - FreshMart</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="menu">
      <a href="../index.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 12L12 4l9 8v8a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>
      </a>
      <a href="cart.html" class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </a>
      <a href="invoice.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </a>
      <a href="notification.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7"/></svg>
      </a>
      <a href="account.html" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </a>
    </div>
    <div class="bottom">
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-14 0"/></svg>
      </div>
    </div>
  </div>

  <main class="invoice-main">
    <!-- LEFT: Invoice list -->
    <section class="invoice-panel invoice-left">
      <h2 class="invoice-heading">Invoice History</h2>
      <div class="invoice-list-card">
        <h3 class="invoice-subtitle">All Invoices</h3>
        <div id="invoice-list">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </section>

    <!-- RIGHT: Invoice detail -->
    <section class="invoice-panel invoice-right">
      <div class="invoice-title-row">
        <h2 class="invoice-heading" id="detail-title">Select an invoice</h2>
      </div>

      <div class="invoice-info" id="detail-info" style="display:none;">
        <h3 class="invoice-subtitle">Details</h3>
        <div class="invoice-detail-grid">
          <div><span>Date</span><strong id="det-date">--</strong></div>
          <div><span>Customer</span><strong id="det-customer">--</strong></div>
          <div><span>Employee</span><strong id="det-employee">--</strong></div>
          <div><span>Payment</span><strong id="det-payment">--</strong></div>
        </div>
      </div>

      <div class="invoice-orders" id="detail-items" style="display:none;">
        <h3 class="invoice-subtitle">Products</h3>
        <div id="detail-products"></div>
      </div>

      <div class="invoice-bill-summary" id="detail-summary" style="display:none;">
        <div class="bill-row"><span>Subtotal</span><span id="det-subtotal">$0.00</span></div>
        <div class="bill-row"><span>VAT (10%)</span><span id="det-tax">$0.00</span></div>
        <div class="bill-row bill-total"><span>TOTAL</span><span id="det-total">$0.00</span></div>
      </div>

      <button class="invoice-print-btn" type="button" id="btn-print" style="display:none;" onclick="window.print()">Print Invoice</button>
    </section>
  </main>
</div>

<script src="../javascript/mock-data.js"></script>
<script>
  let selectedHD = null;

  window.onload = function() {
    renderInvoiceList();
    if (MOCK_HOADON.length > 0) {
      selectInvoice(MOCK_HOADON[0].MaHD);
    }
  };

  function renderInvoiceList() {
    const container = document.getElementById('invoice-list');
    container.innerHTML = MOCK_HOADON.map(hd => {
      const customer = getCustomerById(hd.MaKH);
      return `
        <div class="invoice-order-item ${selectedHD === hd.MaHD ? 'active' : ''}"
             onclick="selectInvoice('${hd.MaHD}')" style="cursor:pointer;">
          <div>
            <h4>${hd.MaHD}</h4>
            <p>${hd.NgayLap} · ${customer ? customer.HoTen : hd.MaKH}</p>
          </div>
          <div class="invoice-order-right">
            <span class="status total">Total</span>
            <strong>$${hd.TongTien.toFixed(2)}</strong>
          </div>
        </div>
      `;
    }).join('');
  }

  function selectInvoice(maHD) {
    selectedHD = maHD;
    const hd = MOCK_HOADON.find(h => h.MaHD === maHD);
    if (!hd) return;

    const customer = getCustomerById(hd.MaKH);
    const employee = getEmployeeById(hd.MaNV);
    const payment = getPaymentById(hd.MaPT);
    const details = getInvoiceDetails(maHD);

    document.getElementById('detail-title').innerText = 'Invoice ' + hd.MaHD;

    document.getElementById('detail-info').style.display = '';
    document.getElementById('det-date').innerText = hd.NgayLap;
    document.getElementById('det-customer').innerText = (customer ? customer.HoTen : '') + ' (' + hd.MaKH + ')';
    document.getElementById('det-employee').innerText = (employee ? employee.HoTen : '') + ' (' + hd.MaNV + ')';
    document.getElementById('det-payment').innerText = (payment ? payment.TenPT : '') + ' (' + hd.MaPT + ')';

    document.getElementById('detail-items').style.display = '';
    const productsContainer = document.getElementById('detail-products');
    productsContainer.innerHTML = details.map(ct => {
      const sp = getProductById(ct.MaSP);
      return `
        <div class="invoice-food-row">
          <img src="${sp ? sp.image : ''}" alt="${sp ? sp.TenSP : ct.MaSP}">
          <p>${sp ? sp.TenSP : ct.MaSP} <small style="color:#999;">(${ct.MaSP})</small> <b>x ${ct.SoLuong}</b></p>
          <strong>$${(ct.DonGia * ct.SoLuong).toFixed(2)}</strong>
        </div>
      `;
    }).join('');

    // Bill summary
    let subtotal = details.reduce((s, ct) => s + ct.DonGia * ct.SoLuong, 0);
    let tax = subtotal * 0.1;
    let total = subtotal + tax;
    document.getElementById('detail-summary').style.display = '';
    document.getElementById('det-subtotal').innerText = '$' + subtotal.toFixed(2);
    document.getElementById('det-tax').innerText = '$' + tax.toFixed(2);
    document.getElementById('det-total').innerText = '$' + total.toFixed(2);

    document.getElementById('btn-print').style.display = '';
    renderInvoiceList();
  }
</script>
</body>
</html>
