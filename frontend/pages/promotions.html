<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promotions - FreshMart</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/tables.css" />
    <link rel="stylesheet" href="../css/modals.css" />
  </head>
  <body>
    <div class="app">
      <div class="sidebar">
        <div class="menu">
          <a href="../index.html" class="nav-item">
            <svg viewBox="0 0 24 24">
              <path
                d="M3 12L12 4l9 8v8a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"
              />
            </svg>
          </a>
          <a href="cart.html" class="nav-item">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
          </a>
          <a href="invoice.html" class="nav-item">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="4" width="14" height="16" rx="2" />
              <line x1="8" y1="8" x2="16" y2="8" />
              <line x1="8" y1="12" x2="16" y2="12" />
            </svg>
          </a>
          <a href="promotions.html" class="nav-item active">
            <svg viewBox="0 0 24 24">
              <path d="M20 12v10H4V12" />
              <path d="M2 7h20v5H2z" />
              <path d="M12 22V7" />
              <path d="M12 7a3 3 0 00-3-3c-1.7 0-3 1.3-3 3" />
              <path d="M12 7a3 3 0 013-3c1.7 0 3 1.3 3 3" />
            </svg>
          </a>
          <a href="notification.html" class="nav-item">
            <svg viewBox="0 0 24 24">
              <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7" />
            </svg>
          </a>
          <a href="account.html" class="nav-item">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
          </a>
        </div>
        <div class="bottom">
          <div class="nav-item">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path d="M19 12a7 7 0 00-14 0" />
            </svg>
          </div>
        </div>
      </div>

      <main class="main-content">
        <div class="header">
          <h1 class="page-title">Promotions</h1>
          <button class="btn-add" onclick="openAddPromoModal()">
            + Add Promotion
          </button>
        </div>

        <div class="table-card">
          <table style="table-layout: fixed">
            <thead>
              <tr>
                <th style="width: 80px">ID</th>
                <th>Name</th>
                <th style="width: 120px">Start Date</th>
                <th style="width: 120px">End Date</th>
                <th style="width: 90px">Products</th>
                <th style="width: 110px">Status</th>
                <th style="width: 160px">Action</th>
              </tr>
            </thead>
            <tbody id="promo-table-body"></tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- MODAL: Add Promotion -->
    <div id="modal-add-promo" class="modal-overlay">
      <div class="modal-form-card" style="width: 480px">
        <div class="modal-form-header">
          <h3>Add New Promotion</h3>
          <button class="close-btn" onclick="closeModal('modal-add-promo')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form onsubmit="savePromo(event)">
          <div class="form-group" style="margin-bottom: 16px">
            <label>Promotion Name</label>
            <input
              type="text"
              id="inp-tenkm"
              placeholder="Enter promotion name"
              required
              style="height: 44px"
            />
          </div>
          <div class="promo-date-row">
            <div class="form-group">
              <label>Start Date</label>
              <input
                type="date"
                id="inp-ngaybatdau"
                required
                style="height: 44px"
                oninput="syncEndDateMin('inp-ngaybatdau', 'inp-ngayketthuc')"
              />
            </div>
            <div class="form-group">
              <label>End Date</label>
              <input
                type="date"
                id="inp-ngayketthuc"
                required
                style="height: 44px"
              />
              <span class="date-error" id="inp-date-error"></span>
            </div>
          </div>
          <div class="modal-form-footer">
            <button
              type="button"
              class="btn-cancel"
              onclick="closeModal('modal-add-promo')"
            >
              Cancel
            </button>
            <button type="submit" class="btn-confirm">Create Promotion</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL: Edit Promotion -->
    <div id="modal-edit-promo" class="modal-overlay">
      <div class="modal-form-card" style="width: 480px">
        <div class="modal-form-header">
          <h3>Edit Promotion</h3>
          <button class="close-btn" onclick="closeModal('modal-edit-promo')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form onsubmit="updatePromo(event)">
          <input type="hidden" id="edit-makm" />
          <div class="form-group" style="margin-bottom: 16px">
            <label>Promotion ID</label>
            <input
              type="text"
              id="edit-makm-display"
              readonly
              style="
                height: 44px;
                background: #f9fafb;
                color: #94a3b8;
                cursor: default;
              "
            />
          </div>
          <div class="form-group" style="margin-bottom: 16px">
            <label>Promotion Name</label>
            <input type="text" id="edit-tenkm" required style="height: 44px" />
          </div>
          <div class="promo-date-row">
            <div class="form-group">
              <label>Start Date</label>
              <input
                type="date"
                id="edit-ngaybatdau"
                required
                style="height: 44px"
                oninput="syncEndDateMin('edit-ngaybatdau', 'edit-ngayketthuc')"
              />
            </div>
            <div class="form-group">
              <label>End Date</label>
              <input
                type="date"
                id="edit-ngayketthuc"
                required
                style="height: 44px"
              />
              <span class="date-error" id="edit-date-error"></span>
            </div>
          </div>
          <div
            class="promo-assigned-bar"
            id="edit-assigned-bar"
            style="display: none"
          >
            <span id="edit-assigned-count">0 products assigned</span>
            <a href="#" id="edit-manage-link" onclick="return false;"
              >Manage &rarr;</a
            >
          </div>
          <div class="modal-form-footer">
            <button
              type="button"
              class="btn-cancel"
              onclick="closeModal('modal-edit-promo')"
            >
              Cancel
            </button>
            <button type="submit" class="btn-confirm">Update Promotion</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL: Manage Products -->
    <div id="modal-products" class="modal-overlay">
      <div class="modal-form-card" style="width: 560px">
        <div class="modal-form-header" style="margin-bottom: 16px">
          <div>
            <h3 id="products-modal-title">Manage Products</h3>
            <p id="products-modal-subtitle" class="promo-modal-subtitle"></p>
          </div>
          <button class="close-btn" onclick="closeModal('modal-products')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="promo-add-row">
          <div class="promo-add-field" style="flex: 1">
            <label>Add Product</label>
            <select id="add-product-select">
              <option value="">Select Product...</option>
            </select>
          </div>
          <div class="promo-add-field" style="width: 140px">
            <label>Discount (₫)</label>
            <input
              type="number"
              id="add-product-mucgiam"
              placeholder="0"
              min="1"
            />
          </div>
          <button
            type="button"
            class="promo-add-btn"
            onclick="addProductToPromo()"
          >
            <i class="fa-solid fa-plus"></i> Add
          </button>
        </div>

        <div class="promo-section-title" id="products-section-title">
          Assigned Products
        </div>

        <div id="promo-products-list" class="promo-products-list"></div>

        <div class="modal-form-footer">
          <button
            type="button"
            class="btn-cancel"
            onclick="closeModal('modal-products')"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- MODAL: Delete Confirmation -->
    <div id="modal-delete-promo" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-icon">
          <i
            class="fa-solid fa-trash"
            style="color: #ef4444; font-size: 36px"
          ></i>
        </div>
        <h3>Delete Promotion</h3>
        <p>
          Are you sure you want to delete <b id="delete-promo-name"></b>? This
          will also remove all assigned products.
        </p>
        <div class="modal-buttons">
          <button class="btn-cancel" onclick="closeModal('modal-delete-promo')">
            Cancel
          </button>
          <button
            class="btn-confirm"
            style="background: #ef4444"
            onclick="confirmDeletePromo()"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <script src="../javascript/api.js"></script>
    <script>
      let promosCache = [];
      let productsCache = [];
      let currentPromoMaKM = null;

      window.onload = async function () {
        const empData = localStorage.getItem("loggedInEmployee");
        if (!empData) {
          window.location.href = "../login.html";
          return;
        }
        const emp = JSON.parse(empData);
        if (emp.ChucVu !== "Quản lý") {
          window.location.href = "../index.html";
          return;
        }

        try {
          [promosCache, productsCache] = await Promise.all([
            apiGetAllPromotions(),
            apiGetProducts(),
          ]);
          renderPromoTable();
        } catch (err) {
          showToast("Không thể tải dữ liệu: " + err.message, "error");
        }
      };

      function closeModal(id) {
        document.getElementById(id).style.display = "none";
      }

      function syncEndDateMin(startId, endId) {
        var startVal = document.getElementById(startId).value;
        var endInp = document.getElementById(endId);
        endInp.min = startVal;
        if (endInp.value && endInp.value < startVal) {
          endInp.value = startVal;
        }
      }

      function getStatus(promo) {
        var today = new Date().toISOString().slice(0, 10);
        if (promo.NgayKetThuc < today)
          return { label: "Expired", color: "#ef4444", bg: "#fef2f2" };
        if (promo.NgayBatDau > today)
          return { label: "Upcoming", color: "#3b82f6", bg: "#dbeafe" };
        return { label: "Active", color: "#22c55e", bg: "#dcfce7" };
      }

      function renderPromoTable() {
        var tbody = document.getElementById("promo-table-body");
        tbody.innerHTML = promosCache
          .map(function (promo) {
            var s = getStatus(promo);
            return (
              "<tr>" +
              '<td><span class="pid">' +
              promo.MaKM +
              "</span></td>" +
              '<td class="td-name">' +
              promo.TenKM +
              "</td>" +
              '<td class="td-date">' +
              promo.NgayBatDau +
              "</td>" +
              '<td class="td-date">' +
              promo.NgayKetThuc +
              "</td>" +
              '<td><span class="td-products">' +
              '<i class="fa-solid fa-box"></i> ' +
              promo.products.length +
              " items</span></td>" +
              '<td><span class="badge" style="background:' +
              s.bg +
              ";color:" +
              s.color +
              ';">' +
              '<span class="badge-dot" style="background:' +
              s.color +
              ';"></span>' +
              s.label +
              "</span></td>" +
              '<td class="actions">' +
              '<button class="btn-edit" onclick="editPromo(\'' +
              promo.MaKM +
              "')\">" +
              '<i class="fa-solid fa-pencil"></i> Edit</button>' +
              '<button class="btn-del" onclick="deletePromo(\'' +
              promo.MaKM +
              "')\">" +
              '<i class="fa-solid fa-trash"></i> Delete</button>' +
              "</td>" +
              "</tr>"
            );
          })
          .join("");
      }

      function openAddPromoModal() {
        document.getElementById("inp-tenkm").value = "";
        document.getElementById("inp-ngaybatdau").value = "";
        document.getElementById("inp-ngayketthuc").value = "";
        document.getElementById("modal-add-promo").style.display = "flex";
      }

      async function savePromo(e) {
        e.preventDefault();
        var tenKM = document.getElementById("inp-tenkm").value.trim();
        var ngayBD = document.getElementById("inp-ngaybatdau").value;
        var ngayKT = document.getElementById("inp-ngayketthuc").value;

        var errors = validateForm([
          {
            name: "Tên khuyến mãi",
            value: tenKM,
            required: true,
            maxLength: 100,
          },
        ]);
        if (errors.length > 0) {
          showToast(errors[0], "error");
          return;
        }
        var dateErr = document.getElementById("inp-date-error");
        if (ngayKT < ngayBD) {
          dateErr.textContent = "End date must be after start date";
          document.getElementById("inp-ngayketthuc").style.borderColor =
            "#ef4444";
          return;
        }
        dateErr.textContent = "";
        document.getElementById("inp-ngayketthuc").style.borderColor = "";

        try {
          await apiCreatePromotion({
            TenKM: tenKM,
            NgayBatDau: ngayBD,
            NgayKetThuc: ngayKT,
          });
          promosCache = await apiGetAllPromotions();
          closeModal("modal-add-promo");
          renderPromoTable();
          showToast("Tạo khuyến mãi thành công!", "success");
        } catch (err) {
          showToast("Lỗi: " + err.message, "error");
        }
      }

      function editPromo(maKM) {
        var promo = promosCache.find(function (p) {
          return p.MaKM === maKM;
        });
        if (!promo) return;
        document.getElementById("edit-makm").value = promo.MaKM;
        document.getElementById("edit-makm-display").value = promo.MaKM;
        document.getElementById("edit-tenkm").value = promo.TenKM;
        document.getElementById("edit-ngaybatdau").value = promo.NgayBatDau;
        document.getElementById("edit-ngayketthuc").value = promo.NgayKetThuc;

        var bar = document.getElementById("edit-assigned-bar");
        var count = promo.products.length;
        if (count > 0) {
          bar.style.display = "";
          document.getElementById("edit-assigned-count").textContent =
            count + " products assigned";
          document.getElementById("edit-manage-link").onclick = function () {
            closeModal("modal-edit-promo");
            openProductsModal(maKM);
            return false;
          };
        } else {
          bar.style.display = "none";
        }

        document.getElementById("modal-edit-promo").style.display = "flex";
      }

      async function updatePromo(e) {
        e.preventDefault();
        var maKM = document.getElementById("edit-makm").value;
        var tenKM = document.getElementById("edit-tenkm").value.trim();
        var ngayBD = document.getElementById("edit-ngaybatdau").value;
        var ngayKT = document.getElementById("edit-ngayketthuc").value;

        var errors = validateForm([
          {
            name: "Tên khuyến mãi",
            value: tenKM,
            required: true,
            maxLength: 100,
          },
        ]);
        if (errors.length > 0) {
          showToast(errors[0], "error");
          return;
        }
        var dateErr = document.getElementById("edit-date-error");
        if (ngayKT < ngayBD) {
          dateErr.textContent = "End date must be after start date";
          document.getElementById("edit-ngayketthuc").style.borderColor =
            "#ef4444";
          return;
        }
        dateErr.textContent = "";
        document.getElementById("edit-ngayketthuc").style.borderColor = "";

        try {
          await apiUpdatePromotion(maKM, {
            TenKM: tenKM,
            NgayBatDau: ngayBD,
            NgayKetThuc: ngayKT,
          });
          promosCache = await apiGetAllPromotions();
          closeModal("modal-edit-promo");
          renderPromoTable();
          showToast("Cập nhật thành công!", "success");
        } catch (err) {
          showToast("Lỗi: " + err.message, "error");
        }
      }

      let deletePromoMaKM = null;

      function deletePromo(maKM) {
        var promo = promosCache.find(function (p) {
          return p.MaKM === maKM;
        });
        if (!promo) return;
        deletePromoMaKM = maKM;
        document.getElementById("delete-promo-name").textContent = promo.TenKM;
        document.getElementById("modal-delete-promo").style.display = "flex";
      }

      async function confirmDeletePromo() {
        if (!deletePromoMaKM) return;
        try {
          await apiDeletePromotion(deletePromoMaKM);
          promosCache = await apiGetAllPromotions();
          closeModal("modal-delete-promo");
          renderPromoTable();
          showToast("Đã xóa khuyến mãi " + deletePromoMaKM, "success");
        } catch (err) {
          showToast("Lỗi: " + err.message, "error");
        }
        deletePromoMaKM = null;
      }

      function openProductsModal(maKM) {
        currentPromoMaKM = maKM;
        var promo = promosCache.find(function (p) {
          return p.MaKM === maKM;
        });
        if (!promo) return;

        document.getElementById("products-modal-title").innerText =
          "Manage Products — " + promo.TenKM;
        document.getElementById("products-modal-subtitle").innerText =
          promo.MaKM + " · " + promo.products.length + " products assigned";

        var select = document.getElementById("add-product-select");
        var assignedIds = promo.products.map(function (p) {
          return p.MaSP;
        });
        select.innerHTML = '<option value="">Select Product...</option>';
        productsCache.forEach(function (sp) {
          if (assignedIds.indexOf(sp.MaSP) === -1) {
            var opt = document.createElement("option");
            opt.value = sp.MaSP;
            opt.textContent =
              sp.MaSP + " - " + sp.TenSP + " (" + fmtVND(sp.GiaBan) + ")";
            select.appendChild(opt);
          }
        });
        document.getElementById("add-product-mucgiam").value = "";

        renderProductsList(promo);
        document.getElementById("modal-products").style.display = "flex";
      }

      function renderProductsList(promo) {
        var container = document.getElementById("promo-products-list");
        var sectionTitle = document.getElementById("products-section-title");
        if (promo.products.length === 0) {
          sectionTitle.style.display = "none";
          container.innerHTML =
            '<p style="text-align:center;color:#aaa;padding:30px 20px;font-weight:600;">No products assigned</p>';
          return;
        }
        sectionTitle.style.display = "";
        container.innerHTML = promo.products
          .map(function (p) {
            return (
              '<div class="promo-product-item">' +
              '<div class="promo-product-item-info">' +
              '<span class="promo-product-item-name">' +
              p.TenSP +
              "</span>" +
              '<span class="promo-product-item-id">' +
              p.MaSP +
              "</span>" +
              "</div>" +
              '<span class="promo-discount-badge">-' +
              fmtVND(p.MucGiam) +
              "</span>" +
              '<button class="promo-remove-btn" onclick="removeProductFromPromo(\'' +
              p.MaSP +
              '\')" title="Remove">' +
              '<i class="fa-solid fa-xmark"></i>' +
              "</button>" +
              "</div>"
            );
          })
          .join("");
      }

      async function addProductToPromo() {
        var maSP = document.getElementById("add-product-select").value;
        var mucGiam = parseFloat(
          document.getElementById("add-product-mucgiam").value,
        );
        if (!maSP) {
          showToast("Vui lòng chọn sản phẩm", "error");
          return;
        }
        if (!mucGiam || mucGiam <= 0) {
          showToast("Mức giảm phải > 0", "error");
          return;
        }

        try {
          await apiAddProductToPromo(currentPromoMaKM, {
            MaSP: maSP,
            MucGiam: mucGiam,
          });
          promosCache = await apiGetAllPromotions();
          var promo = promosCache.find(function (p) {
            return p.MaKM === currentPromoMaKM;
          });
          openProductsModal(currentPromoMaKM);
          renderPromoTable();
          showToast("Đã thêm sản phẩm!", "success");
        } catch (err) {
          showToast("Lỗi: " + err.message, "error");
        }
      }

      async function removeProductFromPromo(maSP) {
        try {
          await apiRemoveProductFromPromo(currentPromoMaKM, maSP);
          promosCache = await apiGetAllPromotions();
          var promo = promosCache.find(function (p) {
            return p.MaKM === currentPromoMaKM;
          });
          openProductsModal(currentPromoMaKM);
          renderPromoTable();
          showToast("Đã xóa sản phẩm khỏi khuyến mãi", "success");
        } catch (err) {
          showToast("Lỗi: " + err.message, "error");
        }
      }
    </script>
  </body>
</html>
