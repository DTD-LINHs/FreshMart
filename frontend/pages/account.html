<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Settings - FreshMart</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/tables.css" />
    <link rel="stylesheet" href="../css/modals.css" />
    <link rel="stylesheet" href="../css/account.css" />
  </head>
  <body>
    <div class="app">
      <div class="sidebar">
        <div class="menu">
          <a href="../index.html" class="nav-item">
            <svg viewBox="0 0 24 24">
              <path
                d="M3 12L12 4l9 8v8a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"
              />
            </svg>
          </a>
          <a href="cart.html" class="nav-item">
            <svg viewBox="0 0 24 24" class="nav-icon-grid">
              <rect x="4" y="4" width="6" height="6" rx="1.5" />
              <rect x="14" y="4" width="6" height="6" rx="1.5" />
              <rect x="4" y="14" width="6" height="6" rx="1.5" />
              <rect x="14" y="14" width="6" height="6" rx="1.5" />
            </svg>
          </a>
          <a href="invoice.html" class="nav-item">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="4" width="14" height="16" rx="2" />
              <line x1="8" y1="8" x2="16" y2="8" />
              <line x1="8" y1="12" x2="16" y2="12" />
            </svg>
          </a>
          <a
            href="promotions.html"
            class="nav-item"
            id="nav-promotions"
            style="display: none"
          >
            <svg viewBox="0 0 24 24">
              <path d="M20 12v10H4V12" />
              <path d="M2 7h20v5H2z" />
              <path d="M12 22V7" />
              <path d="M12 7a3 3 0 00-3-3c-1.7 0-3 1.3-3 3" />
              <path d="M12 7a3 3 0 013-3c1.7 0 3 1.3 3 3" />
            </svg>
          </a>
          <a href="notification.html" class="nav-item">
            <svg viewBox="0 0 24 24">
              <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7" />
            </svg>
          </a>
          <a href="account.html" class="nav-item active">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
            </svg>
          </a>
        </div>
        <div class="bottom">
          <div class="nav-item">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path d="M19 12a7 7 0 00-14 0" />
            </svg>
          </div>
        </div>
      </div>

      <main class="main-content">
        <h1 class="page-title">My Profile</h1>

        <!-- Profile Card -->
        <div class="profile-card">
          <div class="profile-avatar-col">
            <div class="profile-avatar">
              <i class="fa-solid fa-user"></i>
            </div>
            <span class="profile-avatar-id" id="acc-id"></span>
          </div>
          <div class="profile-form-col">
            <form onsubmit="saveAccount(event)">
              <div class="profile-form-row" style="margin-bottom: 16px">
                <div class="form-group">
                  <label>Full Name</label>
                  <input type="text" id="acc-hoten" required />
                </div>
                <div class="form-group">
                  <label>Phone</label>
                  <input type="text" id="acc-sdt" required />
                </div>
              </div>
              <div class="profile-form-row" style="margin-bottom: 16px">
                <div class="form-group">
                  <label>Role</label>
                  <input type="text" id="acc-chucvu" readonly />
                </div>
                <div class="form-group">
                  <label>Start Date</label>
                  <input type="date" id="acc-ngayvaolam" readonly />
                </div>
              </div>
              <div class="profile-save-row">
                <button type="submit" class="save-btn">Save Changes</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Change Password -->
        <div style="margin-top: 28px">
          <h2 style="font-size: 20px; font-weight: 800; color: #1e293b; margin-bottom: 16px">Change Password</h2>
          <div class="profile-card">
            <div class="profile-avatar-col">
              <div class="profile-avatar" style="background: #dbeafe; color: #3b82f6">
                <i class="fa-solid fa-lock"></i>
              </div>
            </div>
            <div class="profile-form-col">
              <form onsubmit="changePassword(event)">
                <div class="form-group" style="margin-bottom: 16px">
                  <label>Current Password</label>
                  <input type="password" id="pw-current" required placeholder="Enter current password" oncopy="return false" oncut="return false" onpaste="return false" />
                </div>
                <div class="profile-form-row" style="margin-bottom: 16px">
                  <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="pw-new" required placeholder="Min 6 characters" oncopy="return false" oncut="return false" onpaste="return false" />
                  </div>
                  <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="pw-confirm" required placeholder="Re-enter new password" oncopy="return false" oncut="return false" onpaste="return false" />
                  </div>
                </div>
                <div class="profile-save-row">
                  <button type="submit" class="save-btn">Update Password</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Staff Management (Manager only) -->
        <div id="staff-section" style="display: none; margin-top: 28px">
          <div class="staff-header">
            <h2>Staff Management</h2>
            <button class="btn-add" onclick="openAddStaffModal()">
              <i class="fa-solid fa-plus"></i> Add Employee
            </button>
          </div>
          <div class="table-card">
            <table>
              <thead>
                <tr>
                  <th style="width: 80px">ID</th>
                  <th>Name</th>
                  <th style="width: 130px">Role</th>
                  <th style="width: 130px">Phone</th>
                  <th style="width: 120px">Start Date</th>
                  <th style="width: 200px">Actions</th>
                </tr>
              </thead>
              <tbody id="staff-table-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- MODAL: Add Employee -->
    <div id="modal-add-staff" class="modal-overlay">
      <div class="modal-form-card" style="width: 480px">
        <div class="modal-form-header">
          <h3>Add New Employee</h3>
          <button class="close-btn" onclick="closeModal('modal-add-staff')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form onsubmit="saveStaff(event)">
          <div class="form-group" style="margin-bottom: 16px">
            <label>Full Name</label>
            <input
              type="text"
              id="staff-hoten"
              placeholder="Enter full name"
              required
              style="height: 44px"
            />
          </div>
          <div class="form-group" style="margin-bottom: 16px">
            <label>Phone</label>
            <input
              type="text"
              id="staff-sdt"
              placeholder="0912345678"
              required
              style="height: 44px"
            />
          </div>
          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 16px;
              margin-bottom: 16px;
            "
          >
            <div class="form-group">
              <label>Role</label>
              <select id="staff-chucvu" required style="height: 44px">
                <option value="">Select role...</option>
                <option value="Quản lý">Quản lý</option>
                <option value="Thu ngân">Thu ngân</option>
                <option value="Bán hàng">Bán hàng</option>
                <option value="Kho">Kho</option>
              </select>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input
                type="text"
                id="staff-password"
                value="123456"
                required
                style="height: 44px"
                placeholder="Min 6 characters"
              />
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 16px">
            <label>Start Date</label>
            <input
              type="date"
              id="staff-ngayvaolam"
              style="height: 44px"
            />
          </div>
          <div class="modal-form-footer">
            <button
              type="button"
              class="btn-cancel"
              onclick="closeModal('modal-add-staff')"
            >
              Cancel
            </button>
            <button type="submit" class="btn-confirm">Create Employee</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL: Edit Employee -->
    <div id="modal-edit-staff" class="modal-overlay">
      <div class="modal-form-card" style="width: 480px">
        <div class="modal-form-header">
          <h3>Edit Employee</h3>
          <button class="close-btn" onclick="closeModal('modal-edit-staff')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form onsubmit="updateStaff(event)">
          <input type="hidden" id="edit-staff-manv" />
          <div class="form-group" style="margin-bottom: 16px">
            <label>Employee ID</label>
            <input
              type="text"
              id="edit-staff-id"
              readonly
              style="
                height: 44px;
                background: #f9fafb;
                color: #94a3b8;
                cursor: default;
              "
            />
          </div>
          <div class="form-group" style="margin-bottom: 16px">
            <label>Full Name</label>
            <input
              type="text"
              id="edit-staff-hoten"
              required
              style="height: 44px"
            />
          </div>
          <div
            style="
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 16px;
              margin-bottom: 16px;
            "
          >
            <div class="form-group">
              <label>Role</label>
              <select id="edit-staff-chucvu" required style="height: 44px">
                <option value="Quản lý">Quản lý</option>
                <option value="Thu ngân">Thu ngân</option>
                <option value="Bán hàng">Bán hàng</option>
                <option value="Kho">Kho</option>
              </select>
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input
                type="text"
                id="edit-staff-sdt"
                required
                style="height: 44px"
              />
            </div>
          </div>
          <div class="modal-form-footer">
            <button
              type="button"
              class="btn-cancel"
              onclick="closeModal('modal-edit-staff')"
            >
              Cancel
            </button>
            <button type="submit" class="btn-confirm">Update</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL: Reset Password -->
    <div id="modal-reset-pw" class="modal-overlay">
      <div class="modal-content" style="width: 380px">
        <div
          style="
            width: 64px;
            height: 64px;
            border-radius: 32px;
            background: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
          "
        >
          <i
            class="fa-solid fa-key"
            style="font-size: 28px; color: #3b82f6"
          ></i>
        </div>
        <h3>Reset Password</h3>
        <p>
          Reset password for <strong id="reset-pw-name"></strong> (<span
            id="reset-pw-id"
          ></span
          >)? The password will be set to the default:
        </p>
        <div
          style="
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
          "
        >
          <i
            class="fa-solid fa-lock"
            style="font-size: 14px; color: #94a3b8"
          ></i>
          <span style="font-size: 14px; font-weight: 800; color: #1e293b"
            >New password: 123456</span
          >
        </div>
        <div class="modal-buttons">
          <button class="btn-cancel" onclick="closeModal('modal-reset-pw')">
            Cancel
          </button>
          <button
            style="
              background: #3b82f6;
              color: #fff;
              padding: 12px;
              border-radius: 10px;
              border: none;
              font-weight: 700;
              cursor: pointer;
              font-family: &quot;Nunito&quot;, sans-serif;
              font-size: 14px;
              flex: 1;
            "
            onclick="confirmResetPassword()"
          >
            Reset Password
          </button>
        </div>
      </div>
    </div>

    <script src="../javascript/api.js"></script>
    <script>
      let currentEmp = null;
      let staffCache = [];

      window.onload = async function () {
        const empData = localStorage.getItem("loggedInEmployee");
        if (!empData) {
          window.location.href = "../login.html";
          return;
        }
        const stored = JSON.parse(empData);

        var navPromo = document.getElementById("nav-promotions");
        if (stored.ChucVu === "Quản lý") {
          if (navPromo) navPromo.style.display = "";
          document.getElementById("staff-section").style.display = "";
          loadStaffList();
        }

        try {
          currentEmp = await apiGetEmployee(stored.MaNV);
        } catch {
          currentEmp = stored;
        }

        document.getElementById("acc-id").innerText = currentEmp.MaNV;
        document.getElementById("acc-hoten").value = currentEmp.HoTen;
        document.getElementById("acc-chucvu").value = currentEmp.ChucVu || "";
        document.getElementById("acc-sdt").value = currentEmp.SDT || "";
        document.getElementById("acc-ngayvaolam").value =
          currentEmp.NgayVaoLam || "";
      };

      function closeModal(id) {
        document.getElementById(id).style.display = "none";
      }

      async function saveAccount(e) {
        e.preventDefault();

        const hoTen = document.getElementById("acc-hoten").value.trim();
        const sdt = document.getElementById("acc-sdt").value.trim();
        var errors = validateForm([
          { name: "Full name", value: hoTen, required: true },
          {
            name: "Phone",
            value: sdt,
            required: true,
            pattern: /^0\d{9}$/,
          },
        ]);
        if (errors.length > 0) {
          showToast(errors[0], "error");
          return;
        }

        const updates = {
          HoTen: hoTen,
          SDT: sdt,
        };

        try {
          const updated = await apiUpdateEmployee(currentEmp.MaNV, updates);
          showToast("Account updated successfully!", "success");
          localStorage.setItem("loggedInEmployee", JSON.stringify(updated));
        } catch (err) {
          showToast("Failed to save: " + err.message, "error");
        }
      }

      async function changePassword(e) {
        e.preventDefault();
        var current = document.getElementById("pw-current").value;
        var newPw = document.getElementById("pw-new").value;
        var confirm = document.getElementById("pw-confirm").value;

        if (newPw.length < 6) {
          showToast("New password must be at least 6 characters", "error");
          return;
        }
        if (newPw !== confirm) {
          showToast("New passwords do not match", "error");
          return;
        }

        try {
          await apiChangePassword(current, newPw);
          showToast("Password changed successfully!", "success");
          document.getElementById("pw-current").value = "";
          document.getElementById("pw-new").value = "";
          document.getElementById("pw-confirm").value = "";
        } catch (err) {
          showToast(err.message || "Failed to change password", "error");
        }
      }

      // ── Staff Management ──

      async function loadStaffList() {
        try {
          staffCache = await apiGetEmployees();
          renderStaffTable();
        } catch (err) {
          showToast("Failed to load staff: " + err.message, "error");
        }
      }

      function renderStaffTable() {
        var roleColors = {
          "Quản lý": { color: "#7c3aed", bg: "#ede9fe" },
          "Thu ngân": { color: "#3b82f6", bg: "#dbeafe" },
          "Bán hàng": { color: "#22c55e", bg: "#dcfce7" },
          Kho: { color: "#f97316", bg: "#fff7ed" },
        };
        var tbody = document.getElementById("staff-table-body");
        tbody.innerHTML = staffCache
          .map(function (emp) {
            var rc = roleColors[emp.ChucVu] || { color: "#666", bg: "#f3f4f6" };
            return (
              "<tr>" +
              '<td><span class="pid">' + emp.MaNV + "</span></td>" +
              '<td class="td-name">' + emp.HoTen + "</td>" +
              '<td><span class="role-badge" style="background:' + rc.bg + ";color:" + rc.color + ';">' +
              (emp.ChucVu || "") + "</span></td>" +
              '<td class="td-date">' + (emp.SDT || "") + "</td>" +
              '<td class="td-date">' + (emp.NgayVaoLam || "") + "</td>" +
              '<td class="actions">' +
              '<button class="btn-edit" onclick="editStaff(\'' + emp.MaNV + '\')">' +
              '<i class="fa-solid fa-pencil"></i> Edit</button>' +
              '<button class="btn-reset" onclick="resetStaffPassword(\'' + emp.MaNV + '\')">' +
              '<i class="fa-solid fa-key"></i> Reset PW</button>' +
              "</td>" +
              "</tr>"
            );
          })
          .join("");
      }

      function openAddStaffModal() {
        document.getElementById("staff-hoten").value = "";
        document.getElementById("staff-chucvu").value = "";
        document.getElementById("staff-sdt").value = "";
        document.getElementById("staff-password").value = "123456";
        document.getElementById("staff-ngayvaolam").value = new Date()
          .toISOString()
          .slice(0, 10);
        document.getElementById("modal-add-staff").style.display = "flex";
      }

      async function saveStaff(e) {
        e.preventDefault();
        var hoTen = document.getElementById("staff-hoten").value.trim();
        var chucVu = document.getElementById("staff-chucvu").value;
        var sdt = document.getElementById("staff-sdt").value.trim();
        var password = document.getElementById("staff-password").value;
        var ngayVaoLam =
          document.getElementById("staff-ngayvaolam").value || null;

        var errors = validateForm([
          { name: "Full name", value: hoTen, required: true, maxLength: 100 },
          { name: "Role", value: chucVu, required: true },
          {
            name: "Phone",
            value: sdt,
            required: true,
            pattern: /^0\d{9}$/,
          },
          { name: "Password", value: password, required: true },
        ]);
        if (errors.length > 0) {
          showToast(errors[0], "error");
          return;
        }

        try {
          var created = await apiCreateEmployee({
            HoTen: hoTen,
            ChucVu: chucVu,
            SDT: sdt,
            password: password,
            NgayVaoLam: ngayVaoLam,
          });
          closeModal("modal-add-staff");
          showToast(
            "Created " + created.MaNV + " — " + created.HoTen,
            "success",
          );
          loadStaffList();
        } catch (err) {
          showToast("Error: " + err.message, "error");
        }
      }

      function editStaff(maNV) {
        var emp = staffCache.find(function (e) {
          return e.MaNV === maNV;
        });
        if (!emp) return;
        document.getElementById("edit-staff-manv").value = emp.MaNV;
        document.getElementById("edit-staff-id").value = emp.MaNV;
        document.getElementById("edit-staff-hoten").value = emp.HoTen;
        document.getElementById("edit-staff-chucvu").value = emp.ChucVu || "";
        document.getElementById("edit-staff-sdt").value = emp.SDT || "";
        document.getElementById("modal-edit-staff").style.display = "flex";
      }

      async function updateStaff(e) {
        e.preventDefault();
        var maNV = document.getElementById("edit-staff-manv").value;
        var hoTen = document.getElementById("edit-staff-hoten").value.trim();
        var chucVu = document.getElementById("edit-staff-chucvu").value;
        var sdt = document.getElementById("edit-staff-sdt").value.trim();

        var errors = validateForm([
          { name: "Full name", value: hoTen, required: true },
          {
            name: "Phone",
            value: sdt,
            required: true,
            pattern: /^0\d{9}$/,
          },
        ]);
        if (errors.length > 0) {
          showToast(errors[0], "error");
          return;
        }

        try {
          await apiUpdateEmployee(maNV, {
            HoTen: hoTen,
            ChucVu: chucVu,
            SDT: sdt,
          });
          closeModal("modal-edit-staff");
          showToast("Updated " + maNV + " successfully", "success");
          loadStaffList();
        } catch (err) {
          showToast("Error: " + err.message, "error");
        }
      }

      var resetTargetMaNV = null;

      function resetStaffPassword(maNV) {
        var emp = staffCache.find(function (e) {
          return e.MaNV === maNV;
        });
        if (!emp) return;
        resetTargetMaNV = maNV;
        document.getElementById("reset-pw-name").innerText = emp.HoTen;
        document.getElementById("reset-pw-id").innerText = maNV;
        document.getElementById("modal-reset-pw").style.display = "flex";
      }

      async function confirmResetPassword() {
        if (!resetTargetMaNV) return;
        try {
          var result = await apiResetPassword(resetTargetMaNV);
          closeModal("modal-reset-pw");
          showToast(
            "Password reset for " +
              resetTargetMaNV +
              ". New password: " +
              result.default_password,
            "success",
          );
        } catch (err) {
          showToast("Error: " + err.message, "error");
        }
        resetTargetMaNV = null;
      }
    </script>
  </body>
</html>
