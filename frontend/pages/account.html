<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings - FreshMart</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/account.css">
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="menu">
        <a href="../index.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M3 12L12 4l9 8v8a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>
        </a>
        <a href="cart.html" class="nav-item">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </a>
        <a href="invoice.html" class="nav-item">
          <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </a>
        <a href="promotions.html" class="nav-item" id="nav-promotions" style="display:none">
          <svg viewBox="0 0 24 24"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7a3 3 0 00-3-3c-1.7 0-3 1.3-3 3"/><path d="M12 7a3 3 0 013-3c1.7 0 3 1.3 3 3"/></svg>
        </a>
        <a href="notification.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7"/></svg>
        </a>
        <a href="account.html" class="nav-item active">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        </a>
      </div>
      <div class="bottom">
        <div class="nav-item">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-14 0"/></svg>
        </div>
      </div>
    </div>

    <main class="main-content">
      <header class="header">
        <h1>Account Settings</h1>
      </header>

      <div class="account-container">
        <!-- Profile Card -->
        <div class="account-profile-card">
          <div class="account-avatar">👤</div>
          <h2 id="acc-name"></h2>
          <p id="acc-role" class="account-role"></p>
          <p id="acc-id" class="account-id"></p>
        </div>

        <!-- Info Form -->
        <div class="account-form-card">
          <h3>Employee Information</h3>
          <form class="account-form" onsubmit="saveAccount(event)">
            <div class="account-form-grid">
              <div class="form-group">
                <label>Employee ID:</label>
                <input type="text" id="acc-manv" readonly>
              </div>
              <div class="form-group">
                <label>Full Name:</label>
                <input type="text" id="acc-hoten" required>
              </div>
              <div class="form-group">
                <label>Role:</label>
                <input type="text" id="acc-chucvu" readonly>
              </div>
              <div class="form-group">
                <label>Phone:</label>
                <input type="text" id="acc-sdt" required>
              </div>
              <div class="form-group">
                <label>Start Date:</label>
                <input type="date" id="acc-ngayvaolam" readonly>
              </div>
            </div>

            <div class="form-footer">
              <button type="submit" class="save-btn">Save Changes</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Staff Management (Manager only) -->
      <div id="staff-section" style="display:none; margin-top:30px;">
        <div class="header">
          <h2 style="font-size:20px;font-weight:800;">Staff Management</h2>
          <button class="btn-add" onclick="openAddStaffModal()">+ Add Employee</button>
        </div>
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Role</th>
                <th>Phone</th>
                <th>Start Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="staff-table-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<!-- MODAL: Add Employee -->
<div id="modal-add-staff" class="modal-overlay">
  <div class="modal-form-card" style="width:460px;">
    <div class="modal-form-header">
      <h3>Add New Employee</h3>
      <button class="close-btn" onclick="closeModal('modal-add-staff')">&times;</button>
    </div>
    <form onsubmit="saveStaff(event)">
      <div class="modal-form-grid" style="grid-template-columns:1fr;">
        <div class="form-group">
          <label>Full Name:</label>
          <input type="text" id="staff-hoten" placeholder="Enter full name" required>
        </div>
        <div class="form-group">
          <label>Role:</label>
          <select id="staff-chucvu" required>
            <option value="">Select Role</option>
            <option value="Quản lý">Quản lý (Manager)</option>
            <option value="Thu ngân">Thu ngân (Cashier)</option>
            <option value="Bán hàng">Bán hàng (Sales)</option>
            <option value="Kho">Kho (Warehouse)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Phone:</label>
          <input type="text" id="staff-sdt" placeholder="0xxxxxxxxx" required>
        </div>
        <div class="form-group">
          <label>Initial Password:</label>
          <input type="text" id="staff-password" value="123456" required>
        </div>
        <div class="form-group">
          <label>Start Date:</label>
          <input type="date" id="staff-ngayvaolam">
        </div>
      </div>
      <div class="modal-form-footer">
        <button type="button" class="btn-cancel" onclick="closeModal('modal-add-staff')">Cancel</button>
        <button type="submit" class="btn-confirm">Create Account</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: Edit Employee -->
<div id="modal-edit-staff" class="modal-overlay">
  <div class="modal-form-card" style="width:460px;">
    <div class="modal-form-header">
      <h3>Edit Employee</h3>
      <button class="close-btn" onclick="closeModal('modal-edit-staff')">&times;</button>
    </div>
    <form onsubmit="updateStaff(event)">
      <input type="hidden" id="edit-staff-manv">
      <div class="modal-form-grid" style="grid-template-columns:1fr;">
        <div class="form-group">
          <label>Employee ID:</label>
          <input type="text" id="edit-staff-id" readonly>
        </div>
        <div class="form-group">
          <label>Full Name:</label>
          <input type="text" id="edit-staff-hoten" required>
        </div>
        <div class="form-group">
          <label>Role:</label>
          <select id="edit-staff-chucvu" required>
            <option value="Quản lý">Quản lý (Manager)</option>
            <option value="Thu ngân">Thu ngân (Cashier)</option>
            <option value="Bán hàng">Bán hàng (Sales)</option>
            <option value="Kho">Kho (Warehouse)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Phone:</label>
          <input type="text" id="edit-staff-sdt" required>
        </div>
      </div>
      <div class="modal-form-footer">
        <button type="button" class="btn-cancel" onclick="closeModal('modal-edit-staff')">Cancel</button>
        <button type="submit" class="btn-confirm">Update</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: Reset Password -->
<div id="modal-reset-pw" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-icon">🔑</div>
    <h3>Reset Password</h3>
    <p>Reset password for <strong id="reset-pw-name"></strong> (<span id="reset-pw-id"></span>) to default <code style="background:#f3f4f6;padding:2px 8px;border-radius:6px;font-weight:800;">123456</code>?</p>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('modal-reset-pw')">Cancel</button>
      <button class="btn-confirm" onclick="confirmResetPassword()">Reset</button>
    </div>
  </div>
</div>

<script src="../javascript/api.js"></script>
<script>
  let currentEmp = null;
  let staffCache = [];

  window.onload = async function() {
    const empData = localStorage.getItem('loggedInEmployee');
    if (!empData) {
      window.location.href = '../login.html';
      return;
    }
    const stored = JSON.parse(empData);

    var navPromo = document.getElementById('nav-promotions');
    if (stored.ChucVu === 'Quản lý') {
      if (navPromo) navPromo.style.display = '';
      document.getElementById('staff-section').style.display = '';
      loadStaffList();
    }

    try {
      currentEmp = await apiGetEmployee(stored.MaNV);
    } catch {
      currentEmp = stored;
    }

    document.getElementById('acc-name').innerText = currentEmp.HoTen;
    document.getElementById('acc-role').innerText = currentEmp.ChucVu || '';
    document.getElementById('acc-id').innerText = currentEmp.MaNV;

    document.getElementById('acc-manv').value = currentEmp.MaNV;
    document.getElementById('acc-hoten').value = currentEmp.HoTen;
    document.getElementById('acc-chucvu').value = currentEmp.ChucVu || '';
    document.getElementById('acc-sdt').value = currentEmp.SDT || '';
    document.getElementById('acc-ngayvaolam').value = currentEmp.NgayVaoLam || '';
  };

  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  async function saveAccount(e) {
    e.preventDefault();

    const hoTen = document.getElementById('acc-hoten').value.trim();
    const sdt = document.getElementById('acc-sdt').value.trim();
    var errors = validateForm([
      { name: 'Họ tên', value: hoTen, required: true },
      { name: 'Số điện thoại', value: sdt, required: true, pattern: /^0\d{9}$/ },
    ]);
    if (errors.length > 0) { showToast(errors[0], 'error'); return; }

    const updates = {
      HoTen: hoTen,
      SDT: sdt,
    };

    try {
      const updated = await apiUpdateEmployee(currentEmp.MaNV, updates);
      showToast('Account updated successfully!', 'success');

      document.getElementById('acc-name').innerText = updated.HoTen;
      document.getElementById('acc-role').innerText = updated.ChucVu || '';

      localStorage.setItem('loggedInEmployee', JSON.stringify(updated));
    } catch (err) {
      showToast('Failed to save: ' + err.message, 'error');
    }
  }

  // ── Staff Management ──

  async function loadStaffList() {
    try {
      staffCache = await apiGetEmployees();
      renderStaffTable();
    } catch (err) {
      showToast('Failed to load staff: ' + err.message, 'error');
    }
  }

  function renderStaffTable() {
    var roleColors = {
      'Quản lý': { color: '#8B5CF6', bg: '#F5F3FF' },
      'Thu ngân': { color: '#3B82F6', bg: '#EFF6FF' },
      'Bán hàng': { color: '#22C55E', bg: '#DCFCE7' },
      'Kho':      { color: '#F59E0B', bg: '#FEF3C7' },
    };
    var tbody = document.getElementById('staff-table-body');
    tbody.innerHTML = staffCache.map(function(emp) {
      var rc = roleColors[emp.ChucVu] || { color: '#666', bg: '#f3f4f6' };
      return '<tr>' +
        '<td><span class="pid">' + emp.MaNV + '</span></td>' +
        '<td style="font-weight:700;">' + emp.HoTen + '</td>' +
        '<td><span style="background:' + rc.bg + ';color:' + rc.color + ';padding:4px 12px;border-radius:16px;font-size:12px;font-weight:700;">' + (emp.ChucVu || '') + '</span></td>' +
        '<td>' + (emp.SDT || '') + '</td>' +
        '<td>' + (emp.NgayVaoLam || '') + '</td>' +
        '<td class="actions">' +
          '<button class="btn-edit" onclick="editStaff(\'' + emp.MaNV + '\')"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> Edit</button>' +
          '<button class="btn-edit" style="background:#FEF3C7;color:#F59E0B;" onclick="resetStaffPassword(\'' + emp.MaNV + '\')"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17a2 2 0 002-2 2 2 0 00-2-2 2 2 0 00-2 2 2 2 0 002 2m6-9a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V10a2 2 0 012-2h1V6a5 5 0 0110 0v2h1m-6-2v2h4V6a2 2 0 00-2-2 2 2 0 00-2 2z"/></svg> Reset PW</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function openAddStaffModal() {
    document.getElementById('staff-hoten').value = '';
    document.getElementById('staff-chucvu').value = '';
    document.getElementById('staff-sdt').value = '';
    document.getElementById('staff-password').value = '123456';
    document.getElementById('staff-ngayvaolam').value = new Date().toISOString().slice(0, 10);
    document.getElementById('modal-add-staff').style.display = 'flex';
  }

  async function saveStaff(e) {
    e.preventDefault();
    var hoTen = document.getElementById('staff-hoten').value.trim();
    var chucVu = document.getElementById('staff-chucvu').value;
    var sdt = document.getElementById('staff-sdt').value.trim();
    var password = document.getElementById('staff-password').value;
    var ngayVaoLam = document.getElementById('staff-ngayvaolam').value || null;

    var errors = validateForm([
      { name: 'Họ tên', value: hoTen, required: true, maxLength: 100 },
      { name: 'Chức vụ', value: chucVu, required: true },
      { name: 'Số điện thoại', value: sdt, required: true, pattern: /^0\d{9}$/ },
      { name: 'Mật khẩu', value: password, required: true },
    ]);
    if (errors.length > 0) { showToast(errors[0], 'error'); return; }

    try {
      var created = await apiCreateEmployee({
        HoTen: hoTen, ChucVu: chucVu, SDT: sdt,
        password: password, NgayVaoLam: ngayVaoLam,
      });
      closeModal('modal-add-staff');
      showToast('Created ' + created.MaNV + ' — ' + created.HoTen, 'success');
      loadStaffList();
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  function editStaff(maNV) {
    var emp = staffCache.find(function(e) { return e.MaNV === maNV; });
    if (!emp) return;
    document.getElementById('edit-staff-manv').value = emp.MaNV;
    document.getElementById('edit-staff-id').value = emp.MaNV;
    document.getElementById('edit-staff-hoten').value = emp.HoTen;
    document.getElementById('edit-staff-chucvu').value = emp.ChucVu || '';
    document.getElementById('edit-staff-sdt').value = emp.SDT || '';
    document.getElementById('modal-edit-staff').style.display = 'flex';
  }

  async function updateStaff(e) {
    e.preventDefault();
    var maNV = document.getElementById('edit-staff-manv').value;
    var hoTen = document.getElementById('edit-staff-hoten').value.trim();
    var chucVu = document.getElementById('edit-staff-chucvu').value;
    var sdt = document.getElementById('edit-staff-sdt').value.trim();

    var errors = validateForm([
      { name: 'Họ tên', value: hoTen, required: true },
      { name: 'Số điện thoại', value: sdt, required: true, pattern: /^0\d{9}$/ },
    ]);
    if (errors.length > 0) { showToast(errors[0], 'error'); return; }

    try {
      await apiUpdateEmployee(maNV, { HoTen: hoTen, ChucVu: chucVu, SDT: sdt });
      closeModal('modal-edit-staff');
      showToast('Updated ' + maNV + ' successfully', 'success');
      loadStaffList();
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  var resetTargetMaNV = null;

  function resetStaffPassword(maNV) {
    var emp = staffCache.find(function(e) { return e.MaNV === maNV; });
    if (!emp) return;
    resetTargetMaNV = maNV;
    document.getElementById('reset-pw-name').innerText = emp.HoTen;
    document.getElementById('reset-pw-id').innerText = maNV;
    document.getElementById('modal-reset-pw').style.display = 'flex';
  }

  async function confirmResetPassword() {
    if (!resetTargetMaNV) return;
    try {
      var result = await apiResetPassword(resetTargetMaNV);
      closeModal('modal-reset-pw');
      showToast('Password reset for ' + resetTargetMaNV + '. New password: ' + result.default_password, 'success');
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
    resetTargetMaNV = null;
  }
</script>
</body>
</html>
